[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drugddi-gnn"
version = "0.1.0"
description = "DGL-based graph neural network framework for drug interaction link prediction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.4.1",
  "dgl==2.4.0",
  "numpy>=1.26,<2.0",
  "pandas>=2.1,<3.0",
  "scikit-learn>=1.4,<2.0",
  "rdkit>=2024.3.1",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
